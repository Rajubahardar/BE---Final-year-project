name: Deploy Dashboard to GitHub Pages
on:
  push:
    branches: [ main ]
    paths:
      - 'dashboard/**'
      - 'results/*.csv'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package dashboard and CSV data
        run: |
          mkdir -p _site/dashboard _site/results
          cp -r dashboard/* _site/dashboard/
          cp results/*.csv _site/results/
          touch _site/.nojekyll
          cat << 'EOF' > _site/index.html
          <!DOCTYPE html>
          <html><head><meta http-equiv="refresh" content="0; url=./dashboard/index.html" /></head>
          <body><a href="./dashboard/index.html">Open Dashboard</a></body></html>
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
